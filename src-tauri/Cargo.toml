[package]
name = "splitpdf_studio"
version = "0.2.2"
description = "A local-first PDF split and edit desktop app"
authors = ["MpBPO PDF Studio"]
edition = "2021"

[lib]
name = "splitpdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image_025 = { package = "image", version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.44.0"
pdfium-auto = "0.3.0"
pdfium-render = "0.8.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
thiserror = "2"
ttf-parser = "0.25"
